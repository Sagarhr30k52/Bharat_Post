    <!-- Custom CSS -->
    <style>
        /* Custom Styles */
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
        }

        .custom-navbar {
            background: linear-gradient(145deg, #ffffff, #f8f9fa);
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            padding: 0.5rem 1rem;
        }

        .nav-link {
            font-weight: 500;
            color: var(--primary-color) !important;
            transition: all 0.3s ease;
            margin: 0 0.5rem;
        }

        .nav-link:hover {
            color: var(--secondary-color) !important;
            transform: translateY(-2px);
        }

        .nav-link.active {
            color: var(--secondary-color) !important;
            position: relative;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--secondary-color);
            border-radius: 2px;
        }

        .hero-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 1rem;
            padding: 4rem 2rem;
            margin: 2rem 0;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(52,152,219,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        .cta-button {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn-primary.cta-button {
            background: var(--secondary-color);
            border: none;
            box-shadow: 0 4px 15px rgba(52,152,219,0.3);
        }

        .btn-primary.cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(52,152,219,0.4);
        }

        .btn-outline-secondary.cta-button {
            border: 2px solid var(--secondary-color);
            color: var(--secondary-color);
        }

        .btn-outline-secondary.cta-button:hover {
            background: var(--secondary-color);
            color: white;
        }

        .chat-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 1.2rem;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(46,204,113,0.3);
            animation: pulse 2s infinite;
            transition: all 0.3s ease;
        }

        .chat-button:hover {
            transform: scale(1.1) rotate(10deg);
            animation: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }
            
            .hero-section {
                padding: 2rem 1rem;
            }
            
            .cta-button {
                width: 100%;
                margin-bottom: 1rem;
            }
        }
    </style>
